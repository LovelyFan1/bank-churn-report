services:
  # ============================================================
  # Redis — Celery broker & result backend
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: churn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # FastAPI Backend
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: churn-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - DATABASE_URL=sqlite:///./data/churn_analysis.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://192.168.1.12:5173","http://192.168.1.12:8000"]
      # ── 数据来源 ────────────────────────────────────────────
      # generator = 启动时现算合成数据（默认，不依赖外部文件）
      # csv       = 读挂载进来的标定数据（customers_simulated.csv，10 万客户）
      #
      # ⚠ 切换数据源前必须清空 customers 表：两套数据的 customer_id
      #   完全重叠（都是 C000001~）但指向不同的人，叠加会出现
      #   「同一编号两套记录」，且不会报任何错。
      #   清空命令见 README 或：docker exec churn-backend python -c "..."
      - DATA_SOURCE=${DATA_SOURCE:-csv}
      - DATA_CSV_PATH=/data-source/customers_simulated.csv
      # 后端 web 进程数，默认 4。6 核实测：1→2.5、4→6.4、6→7.6 req/s。
      # 取 4 是为了留 2 个核给 Celery worker。仅 backend 需要（见下方 command）。
      - WEB_WORKERS=${WEB_WORKERS:-4}
      # ── 智能体（对话式任务型 Agent）──────────────────────
      # key 由项目根目录的 .env 提供（.env 已在 .gitignore 中）。
      # ⚠ 不要把 key 直接写在这里 —— 本文件是纳入版本控制的。
      # AGENT_ENABLED 默认 false：未配置 key 时接口返回 503 并说明原因，
      # 不静默降级成规则匹配（那会让人以为"大模型在回答"，实际没有）。
      - AGENT_ENABLED=${AGENT_ENABLED:-false}
      - AGENT_LLM_API_KEY=${AGENT_LLM_API_KEY:-}
      - AGENT_LLM_BASE_URL=${AGENT_LLM_BASE_URL:-https://api.deepseek.com/v1}
      - AGENT_LLM_MODEL=${AGENT_LLM_MODEL:-deepseek-chat}
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      # 外部数据源，只读挂载。目录不存在时 compose 会建一个空目录，
      # 此时 DATA_SOURCE=csv 会在启动时报「文件不存在」并退出 —— 这是
      # 刻意的：静默回退到合成数据会让人误以为在用标定数据。
      - ./../模拟仿真客户数据:/data-source:ro
    depends_on:
      redis:
        condition: service_healthy
    # ── 启动方式 ────────────────────────────────────────────
    # 用多进程（--workers）而非 --reload。原因：本项目最重的三种活儿
    # （全量打分缓存构建 / 全表 pandas 扫描 / 10 万次 dict 构造）都是
    # **纯 Python 计算，受 GIL 限制**，实测线程并发加速比只有 0.99x，
    # 而多进程是 3.88x。所以提升并发只能靠多进程。
    #
    # ⚠ --reload 会**静默忽略** --workers（uvicorn 只打印一行 WARNING），
    #   所以二者不能同时开。代价：改后端代码后需
    #   `docker compose restart backend` 才生效。
    #   若要恢复热重载（开发时），把 --workers 换成 --reload 即可。
    #
    # ⚠ 每个 worker 各自缓存一份全量打分结果（实测 RSS ≈ 357 MB），
    #   4 worker ≈ 1.43 GB。加大此值前先确认内存。
    #
    # ⚠ 首次部署（customers 表为空）时，多个 worker 会同时执行播种。
    #   seed() 是 check-then-act，无锁竞态：子进程会因 customer_id 唯一
    #   约束冲突抛异常。实测数据不会写坏（恰好一个 worker 成功），
    #   但失败的 worker 会导致容器反复重启。故用 `app.preseed` 先由
    #   单进程播种一次，再启动多 worker —— preseed 幂等，每次启动都跑无害。
    command: sh -c "python -m app.preseed && python run.py"

  # ============================================================
  # Celery Worker — async ML training / prediction
  # ============================================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: churn-celery
    restart: unless-stopped
    environment:
      - DEBUG=true
      - DATABASE_URL=sqlite:///./data/churn_analysis.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # 与 backend 保持一致 —— Celery 训练/批量打分会读同一份配置，
      # 两处不一致会导致「接口说在用标定数据、训练却在用合成数据」。
      - DATA_SOURCE=${DATA_SOURCE:-csv}
      - DATA_CSV_PATH=/data-source/customers_simulated.csv
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - ./../模拟仿真客户数据:/data-source:ro
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 -Q celery

  # ============================================================
  # Vue 3 Frontend (Vite dev server)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: churn-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - API_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    command: npm run dev

volumes:
  redis_data:
  backend_data:
